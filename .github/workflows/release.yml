name: Windows release
on:
  push:
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: windows-release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  installer:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          ref: ${{ github.sha }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
          cache: npm
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87
      - name: Validate release version and signing setup
        shell: pwsh
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
          AZURE_SIGNING_ENDPOINT: ${{ secrets.AZURE_SIGNING_ENDPOINT }}
          AZURE_SIGNING_ACCOUNT: ${{ secrets.AZURE_SIGNING_ACCOUNT }}
          AZURE_SIGNING_PROFILE: ${{ secrets.AZURE_SIGNING_PROFILE }}
        run: |
          foreach ($name in @('AZURE_SIGNING_ENDPOINT', 'AZURE_SIGNING_ACCOUNT', 'AZURE_SIGNING_PROFILE')) {
            $setting = [Environment]::GetEnvironmentVariable($name)
            if ($setting) {
              $mask = $setting.Replace('%', '%25').Replace("`r", '%0D').Replace("`n", '%0A')
              Write-Output "::add-mask::$mask"
            }
            if ([string]::IsNullOrWhiteSpace($setting)) { throw "Add repository Actions secret: $name" }
          }
          if (-not $env:TAURI_SIGNING_PRIVATE_KEY) { throw 'Add the release signing key as TAURI_SIGNING_PRIVATE_KEY in repository Actions secrets.' }
          foreach ($name in @('AZURE_TENANT_ID', 'AZURE_CLIENT_ID', 'AZURE_CLIENT_SECRET')) {
            if (-not [Environment]::GetEnvironmentVariable($name)) { throw "Add repository Actions secret: $name" }
          }
          if ($env:GITHUB_REF_TYPE -cne 'tag' -or $env:GITHUB_REF_NAME -cnotmatch '^v(?<version>\d+\.\d+\.\d+)$') {
            throw 'Run this workflow on an exact stable vMAJOR.MINOR.PATCH tag.'
          }
          $version = $Matches.version
          ./scripts/assert-release-version.ps1 -ProjectRoot (Get-Location).Path -Version $version
          $head = (git rev-parse HEAD).Trim()
          if ($LASTEXITCODE -ne 0) { throw 'Could not resolve checked-out HEAD.' }
          $tagCommit = (git rev-parse "$($env:GITHUB_REF_NAME)^{commit}").Trim()
          if ($LASTEXITCODE -ne 0) { throw 'Could not resolve the release tag commit.' }
          if ($head -cne $env:GITHUB_SHA -or $tagCommit -cne $env:GITHUB_SHA) {
            throw 'Checked-out source, workflow source SHA, and release tag commit must be identical.'
          }
          git diff --quiet
          if ($LASTEXITCODE -ne 0) { throw 'Release source has tracked working-tree changes.' }
          git diff --cached --quiet
          if ($LASTEXITCODE -ne 0) { throw 'Release source has staged changes.' }
          [IO.File]::AppendAllText($env:GITHUB_ENV, "RELEASE_VERSION=$version`n", [Text.UTF8Encoding]::new($false))
      - run: npm ci
      - run: npm run fixtures
      - run: ./scripts/setup-pdfium.ps1
        shell: pwsh
      - name: Fetch locked Windows Cargo registry for offline notice checks
        run: cargo fetch --locked --target x86_64-pc-windows-msvc --manifest-path src-tauri/Cargo.toml
      - run: npm test -- --maxWorkers=2
      - run: cargo test --locked --manifest-path src-tauri/Cargo.toml
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9
        with:
          dotnet-version: '8.0.x'
      - name: Install Azure Artifact Signing CLI
        run: cargo install artifact-signing-cli --version 0.11.0 --locked
      - name: Build publisher-signed installer and signed update manifest
        shell: pwsh
        run: ./scripts/build-installer.ps1 -AzureSigning
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
          AZURE_SIGNING_ENDPOINT: ${{ secrets.AZURE_SIGNING_ENDPOINT }}
          AZURE_SIGNING_ACCOUNT: ${{ secrets.AZURE_SIGNING_ACCOUNT }}
          AZURE_SIGNING_PROFILE: ${{ secrets.AZURE_SIGNING_PROFILE }}
      - name: Verify exact release asset inventory
        shell: pwsh
        run: |
          $bundle = 'src-tauri/target/release/bundle/nsis'
          $installerName = "PDF Workstation_$($env:RELEASE_VERSION)_x64-setup.exe"
          $expected = @($installerName, "$installerName.sig", 'latest.json') | Sort-Object
          $actual = @(Get-ChildItem -LiteralPath $bundle -File | ForEach-Object Name | Sort-Object)
          if ($actual.Count -ne 3 -or (Compare-Object -ReferenceObject $expected -DifferenceObject $actual -CaseSensitive)) {
            throw 'Release bundle must contain exactly the installer, its detached updater signature, and latest.json.'
          }
          foreach ($name in $expected) {
            $path = Join-Path $bundle $name
            if ((Get-Item -LiteralPath $path).Length -le 0) { throw "Release asset is empty: $name" }
          }
          $manifest = Get-Content (Join-Path $bundle 'latest.json') -Raw -Encoding UTF8 | ConvertFrom-Json
          $platform = $manifest.platforms.'windows-x86_64'
          $signature = (Get-Content (Join-Path $bundle "$installerName.sig") -Raw -Encoding UTF8).Trim()
          $assetName = $installerName.Replace(' ', '.')
          $expectedUrl = "https://github.com/Joshua-Beel/Smacrobat/releases/download/v$($env:RELEASE_VERSION)/$assetName"
          $notes = Get-Content docs/release-notes.md -Raw -Encoding UTF8
          if ($manifest.version -cne $env:RELEASE_VERSION -or $platform.url -cne $expectedUrl -or $platform.signature -cne $signature -or $manifest.notes -cne $notes) {
            throw 'Updater manifest is not bound to the exact version, installer, detached signature, and release notes.'
          }
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: windows-installer
          path: |
            src-tauri/target/release/bundle/nsis/PDF Workstation_${{ env.RELEASE_VERSION }}_x64-setup.exe
            src-tauri/target/release/bundle/nsis/PDF Workstation_${{ env.RELEASE_VERSION }}_x64-setup.exe.sig
            src-tauri/target/release/bundle/nsis/latest.json
          if-no-files-found: error
      - name: Create draft release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $bundle = 'src-tauri/target/release/bundle/nsis'
          $installerName = "PDF Workstation_$($env:RELEASE_VERSION)_x64-setup.exe"
          $assets = @(
            (Join-Path $bundle $installerName),
            (Join-Path $bundle "$installerName.sig"),
            (Join-Path $bundle 'latest.json')
          )
          gh release create $env:GITHUB_REF_NAME @assets --repo $env:GITHUB_REPOSITORY --verify-tag --draft --target $env:GITHUB_SHA --title "PDF Workstation $env:GITHUB_REF_NAME" --notes-file docs/release-notes.md
          if ($LASTEXITCODE -ne 0) { throw 'Release creation failed. Existing releases are never overwritten.' }
          $releaseJson = gh release view $env:GITHUB_REF_NAME --repo $env:GITHUB_REPOSITORY --json tagName,isDraft,isPrerelease,targetCommitish,assets
          if ($LASTEXITCODE -ne 0) { throw 'Could not verify the created draft release.' }
          $release = $releaseJson | ConvertFrom-Json
          $expectedNames = @($installerName.Replace(' ', '.'), ($installerName.Replace(' ', '.') + '.sig'), 'latest.json') | Sort-Object
          $actualNames = @($release.assets | ForEach-Object name | Sort-Object)
          if ($release.tagName -cne $env:GITHUB_REF_NAME -or -not $release.isDraft -or $release.isPrerelease -or $release.targetCommitish -cne $env:GITHUB_SHA -or $actualNames.Count -ne 3 -or (Compare-Object -ReferenceObject $expectedNames -DifferenceObject $actualNames -CaseSensitive)) {
            throw 'Created release is not the exact source-bound draft with the required three assets.'
          }
