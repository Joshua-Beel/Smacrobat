<!doctype html>
<html>
<head><meta charset="UTF-8" /><title>Current-page OCR dialog browser test</title><style>body{margin:24px;font-family:sans-serif}dialog{position:relative;margin:0}</style></head>
<body>
<div id="root"></div><p id="proof"></p>
<script type="module">
const mode=new URLSearchParams(location.search).get('case')||'success';
const requestId='11111111-1111-4111-8111-111111111111';
let resolveDeferred;let recognizeCalls=0;let cancelCalls=0;
const receipt=args=>({status:'recognized',requestId:args.requestId,documentId:9,revision:3,page:1,dpi:150,language:'eng',width:612,height:792,text:'Mocked current-page OCR text.'});
window.addEventListener('unhandledrejection',event=>{document.body.dataset.rejection=String(event.reason)});
window.__TAURI_INTERNALS__={invoke:async(command,args)=>{
  if(command==='recognize_page_ocr'){
    recognizeCalls++;document.body.dataset.recognizeCalls=String(recognizeCalls);
    document.getElementById('proof').textContent=`Mocked IPC: ${JSON.stringify({command,args})}`;
    if(mode==='cancel'||mode==='teardown')return new Promise(resolve=>{resolveDeferred=()=>{document.body.dataset.firstSettled='true';resolve(receipt(args))}});
    if(mode==='strict'&&recognizeCalls===1)return new Promise(resolve=>{resolveDeferred=()=>{document.body.dataset.firstSettled='true';resolve(receipt(args))};setTimeout(()=>resolveDeferred?.(),50)});
    if(mode==='empty')return{status:'no_text',requestId:args.requestId,documentId:9,revision:3,page:1,dpi:150,language:'eng',width:612,height:792,text:''};
    return receipt(args);
  }
  if(command==='cancel_page_ocr'){
    cancelCalls++;document.body.dataset.cancelCalls=String(cancelCalls);
    document.getElementById('proof').textContent=`Mocked cancel: ${JSON.stringify({command,args})}`;
    if(mode==='teardown')return Promise.reject(new Error('teardown IPC unavailable'));
    if(mode==='strict')queueMicrotask(()=>resolveDeferred?.());
    return{requestId:args.requestId,status:'cancelled'};
  }
  throw new Error(command);
}};
crypto.randomUUID=()=>requestId;
const[{default:PageOcrDialog},React,{createRoot}]=await Promise.all([import('./PageOcrDialog.tsx'),import('react'),import('react-dom/client')]);
const dialog=React.createElement(PageOcrDialog,{target:{id:9,revision:3,page:1,name:'mock.pdf'},setBusy:()=>{},close:()=>{}});
const root=createRoot(document.getElementById('root'));
root.render(mode==='strict'?React.createElement(React.StrictMode,null,dialog):dialog);
if(mode==='teardown')setTimeout(()=>{document.body.dataset.unmounted='true';root.unmount()},20);
</script>
</body></html>
